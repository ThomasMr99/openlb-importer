[project]
name = "openlb-importer"
version = "0.1.0"
description = "Load OpenLB simulation output (VTK) into numpy arrays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Miro" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyvista",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
